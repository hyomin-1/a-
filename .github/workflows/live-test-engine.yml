
name: A股猎手新版实时测试

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 下载测试分支代码
        uses: actions/checkout@v4

      - name: 配置 Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: python -m pip install -r requirements.txt

      - name: 运行新版 A 股猎手
        run: python engine.py --wait

      - name: 保存报告和学习记录
        run: |
          git add reports
          if git diff --cached --quiet; then
            echo "没有新增的报告或学习记录"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "保存新版猎手报告和学习记录"
            git push
          fi
