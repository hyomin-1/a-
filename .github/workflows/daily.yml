name: A股猎手每日选股

on:
workflow_dispatch:
schedule:
- cron: “30 7 * * 1-5”

permissions:
contents: write

jobs:
scan:
runs-on: ubuntu-latest
timeout-minutes: 50

steps:
  - name: 下载代码
    uses: actions/checkout@v4
  - name: 安装Python
    uses: actions/setup-python@v5
    with:
      python-version: "3.12"
  - name: 安装依赖
    run: |
      python -m pip install --upgrade pip
      pip install -r requirements.txt
  - name: 扫描股票
    run: python hunter.py
  - name: 保存报告
    if: always()
    run: |
      git config user.name "A股猎手机器人"
      git config user.email "actions@users.noreply.github.com"
      git add reports
      git diff --cached --quiet || git commit -m "更新每日选股报告"
      git push
