name: A股猎手-高级版全市场扫描

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行高级版全市场扫描
        env:
          A_SHARE_WORKERS: 20
        run: |
          python hunter.py

      - name: 保存扫描报告和学习记录
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/
          if git diff --cached --quiet; then
            echo "没有新的报告文件需要提交"
          else
            git commit -m "更新A股猎手扫描报告 $(date -u +%F)"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
