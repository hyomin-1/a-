name: A股猎手-高级版全市场扫描

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 执行高级版扫描
        # 设置并发数为 15，加快全市场 4000 只股票的分析速度
        env:
          A_SHARE_WORKERS: 15
        run: |
          python hunter.py

      - name: 保存报告
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reports/
          if git diff --cached --quiet; then
            echo "没有新报告"
          else
            git commit -m "更新A股猎手高级版报告"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
