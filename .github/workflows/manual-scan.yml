
name: A股猎手-手动运行

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashare-hunter-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: A股猎手全市场扫描
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 配置Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查必要文件
        run: |
          test -f config.json
          test -f requirements.txt
          test -f data_source.py
          test -f indicators.py
          test -f learning.py
          test -f hunter.py
          test -f test_engine.py
          echo "项目文件检查通过"

      - name: 执行自动测试
        run: |
          python -m unittest -v test_engine.py

      - name: 执行新版A股全市场扫描
        run: |
          python hunter.py --config config.json --output reports

      - name: 保存扫描报告和学习记录
        if: always()
        run: |
          if [ -d reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A reports/
            if git diff --cached --quiet; then
              echo "没有新的报告需要保存"
            else
              git commit -m "更新A股猎手扫描报告和学习记录"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          fi
