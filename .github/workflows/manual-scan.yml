
name: A股猎手-手动随时运行

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashare-hunter-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run offline tests
        run: python -m unittest -v test_engine.py

      - name: Run A-share scan now
        run: python engine.py --config config.json --output reports

      - name: Commit reports and learning data
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports
          if git diff --cached --quiet; then
            echo "No report changes to commit"
          else
            git commit -m "Update A-share hunter reports and learning data"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
