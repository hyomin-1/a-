
name: A股猎手-手动随时运行

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ashare-hunter-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  scan:
    name: 执行全市场扫描
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: 获取当前分支代码
        uses: actions/checkout@v5
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: 配置 Python 环境
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查项目文件
        run: |
          test -f config.json
          test -f data_source.py
          test -f indicators.py
          test -f hunter.py
          test -f learning.py
          test -f test_engine.py
          echo "项目文件检查通过"

      - name: 执行离线自动测试
        run: |
          python -m unittest -v test_engine.py

      - name: 执行 A 股全市场扫描
        run: |
          python hunter.py --config config.json --output reports

      - name: 保存扫描报告和学习记录
        if: always()
        run: |
          if [ -d reports ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add reports/

            if git diff --cached --quiet; then
              echo "没有新的报告或学习记录需要保存"
            else
              git commit -m "Update A-share hunter reports and learning records"
              git push origin "HEAD:${GITHUB_REF_NAME}"
            fi
          else
            echo "reports 目录不存在，跳过保存"
          fi
