name: A股猎手-隔夜超短扫描

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 获取项目代码
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: 配置Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 检查代码语法
        run: |
          python -m py_compile hunter.py data_source.py

      - name: 执行隔夜超短扫描
        run: |
          python hunter.py

      - name: 保存报告和复盘记录
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          if git diff --cached --quiet; then
            echo "没有新的报告需要保存"
          else
            git commit -m "更新A股猎手报告和复盘记录"
            # 【核心修复】先拉取远端最新代码解决冲突，再推送
            git pull --rebase origin ${GITHUB_REF_NAME}
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
